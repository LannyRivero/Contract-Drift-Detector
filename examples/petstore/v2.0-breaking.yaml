openapi: 3.0.3
info:
  title: Petstore API
  version: 2.0.0
  description: A simple pet store API - BREAKING CHANGES for demo

paths:
  /pets:
    get:
      operationId: listPets
      summary: List all pets
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
        # BREAKING: removed 'species' parameter
      responses:
        "200":
          description: A list of pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pet"
        # BREAKING: removed 404 response
    post:
      operationId: createPet
      summary: Create a pet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPet"
      responses:
        "201":
          description: Pet created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"

  /pets/{petId}:
    get:
      operationId: getPet
      summary: Get a pet by ID
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: token
          in: header
          # BREAKING: token became required
          required: true
          schema:
            type: string
      responses:
        "200":
          description: A pet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "404":
          description: Pet not found
    # BREAKING: DELETE /pets/{petId} removed

components:
  schemas:
    Pet:
      type: object
      required:
        - id
        - name
        - species
        # BREAKING: owner became required
        - owner
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        species:
          type: string
          enum: [dog, cat, bird]
        age:
          # BREAKING: type changed from integer to string
          type: string
        owner:
          type: string
        status:
          type: string
          enum: [available, adopted]
          # BREAKING: removed 'adopted' enum value (implicit)

    NewPet:
      type: object
      required:
        - name
        - species
        # BREAKING: email became required
        - email
      properties:
        name:
          type: string
        species:
          type: string
        email:
          type: string
          format: email
